[pytest]
; Test infrastructure only -- no business code is configured here.
;
; ``integration`` marks the cases under ``tests/host_e2e/`` that need a *live* Hermes host (a
; ``state.db`` under ``HERMES_HOME``). The marker is applied automatically by path in
; ``tests/conftest.py`` (see ``pytest_collection_modifyitems``); it is declared here too so that
; ``pytest -m integration`` / ``-m "not integration"`` work without an "unknown marker" warning.
;
; Behaviour by environment:
;   * no host, HERMES_HOST_REQUIRED unset  -> integration cases are SKIPPED (public clone stays green)
;   * no host, HERMES_HOST_REQUIRED=1      -> hard fail (a CI that wants a host must not go green)
;   * host reachable                       -> integration cases run for real
markers =
    integration: needs a live Hermes host (a state.db under HERMES_HOME); auto-applied to tests/host_e2e/ and skipped when no host is reachable unless HERMES_HOST_REQUIRED=1 is set

testpaths = tests
