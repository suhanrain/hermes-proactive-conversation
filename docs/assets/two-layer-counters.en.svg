<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4b6fff"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="48" y="56" font-size="28" font-weight="700" fill="#111827">proactive-conversation: two-layer counting</text>
  <text x="48" y="86" font-size="15" fill="#6b7280">Window layer: every user message opens a new window (it does not slide per attempt)  ·  Day layer: all windows in the day add up</text>

  <!-- Legend -->
  <rect x="930" y="40" width="16" height="16" rx="7" fill="#2f9e6e"/>
  <text x="954" y="54" font-size="14" fill="#374151">Visible</text>
  <rect x="1012" y="40" width="16" height="16" rx="7" fill="#dbe3ec"/>
  <text x="1036" y="54" font-size="14" fill="#374151">Silent</text>
  <rect x="1090" y="40" width="16" height="16" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="1114" y="54" font-size="14" fill="#374151">Unused</text>

  <!-- Section 1 -->
  <text x="48" y="140" font-size="19" font-weight="700" fill="#111827">① Window layer</text>
  <text x="232" y="140" font-size="14" fill="#6b7280">Reset on every user message; attempts are consumed in order</text>

  <!-- Window 1 marker -->
  <text x="150" y="170" font-size="14" fill="#4b6fff" text-anchor="middle">User message</text>
  <line x1="150" y1="178" x2="150" y2="196" stroke="#4b6fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Window 1 cells: silent silent silent visible visible -->
  <g>
    <rect x="120" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="150" y="222" font-size="11" fill="#64748b" text-anchor="middle">①</text>
    <text x="150" y="243" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Silent</text>

    <rect x="190" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="220" y="222" font-size="11" fill="#64748b" text-anchor="middle">②</text>
    <text x="220" y="243" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Silent</text>

    <rect x="260" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="290" y="222" font-size="11" fill="#64748b" text-anchor="middle">③</text>
    <text x="290" y="243" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Silent</text>

    <rect x="330" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="360" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">④</text>
    <text x="360" y="243" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Visible</text>

    <rect x="400" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="430" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">⑤</text>
    <text x="430" y="243" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Visible</text>
  </g>
  <path d="M121 268 v10 q0 8 8 8 H452 q8 0 8 -8 v-10" fill="none" stroke="#4b6fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="290" y="308" font-size="14" font-weight="600" fill="#4b6fff" text-anchor="middle">Window 1   R_w = 5</text>

  <text x="486" y="218" font-size="13" fill="#334155">At least V_w = 2 visible</text>
  <text x="486" y="244" font-size="13" fill="#334155">Silent allowance = R_w − V_w = 3</text>
  <text x="486" y="270" font-size="12.5" fill="#b45309">Used up → rest forced visible</text>
  <text x="486" y="296" font-size="12.5" fill="#6b7280">(derived automatically, not configured)</text>

  <!-- Window 2 marker -->
  <text x="770" y="170" font-size="14" fill="#4b6fff" text-anchor="middle">User speaks again → new window</text>
  <line x1="770" y1="178" x2="770" y2="196" stroke="#4b6fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Window 2 cells: visible visible silent unused unused -->
  <g>
    <rect x="730" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="760" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">①</text>
    <text x="760" y="243" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Visible</text>

    <rect x="800" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="830" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">②</text>
    <text x="830" y="243" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Visible</text>

    <rect x="870" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="900" y="222" font-size="11" fill="#64748b" text-anchor="middle">③</text>
    <text x="900" y="243" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Silent</text>

    <rect x="940" y="198" width="60" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <text x="970" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">④</text>
    <text x="970" y="243" font-size="12" fill="#94a3b8" text-anchor="middle">Unused</text>

    <rect x="1010" y="198" width="60" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <text x="1040" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">⑤</text>
    <text x="1040" y="243" font-size="12" fill="#94a3b8" text-anchor="middle">Unused</text>
  </g>
  <path d="M731 268 v10 q0 8 8 8 H1062 q8 0 8 -8 v-10" fill="none" stroke="#4b6fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="900" y="308" font-size="14" font-weight="600" fill="#4b6fff" text-anchor="middle">Window 2   R_w = 5 (2 left)</text>

  <text x="128" y="344" font-size="13" fill="#6b7280">The old window ends when the user speaks again; counts never carry across windows.</text>

  <line x1="48" y1="366" x2="1192" y2="366" stroke="#e5e7eb"/>

  <!-- Section 2 -->
  <text x="48" y="404" font-size="19" font-weight="700" fill="#111827">② Day layer</text>
  <text x="176" y="404" font-size="14" fill="#6b7280">Attempts from every window in the day roll up to the daily caps</text>

  <text x="60" y="455" font-size="13.5" fill="#374151">Window 1</text>
  <g>
    <rect x="150" y="438" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="184" y="438" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="218" y="438" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="252" y="438" width="28" height="28" rx="6" fill="#2f9e6e"/>
    <rect x="286" y="438" width="28" height="28" rx="6" fill="#2f9e6e"/>
  </g>

  <text x="60" y="503" font-size="13.5" fill="#374151">Window 2</text>
  <g>
    <rect x="150" y="486" width="28" height="28" rx="6" fill="#2f9e6e"/>
    <rect x="184" y="486" width="28" height="28" rx="6" fill="#2f9e6e"/>
    <rect x="218" y="486" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="252" y="486" width="28" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <rect x="286" y="486" width="28" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
  </g>

  <line x1="232" y1="522" x2="232" y2="546" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <text x="60" y="584" font-size="13.5" fill="#374151">Day attempts</text>
  <g>
    <rect x="180" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="209" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="238" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="267" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
    <rect x="296" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
    <rect x="325" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
    <rect x="354" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="383" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
  </g>
  <text x="418" y="585" font-size="16" fill="#94a3b8">…</text>
  <line x1="466" y1="559" x2="466" y2="599" stroke="#4b6fff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="476" y="585" font-size="14" font-weight="600" fill="#4b6fff">≤ R_d</text>

  <text x="60" y="630" font-size="13.5" fill="#374151">Day silent</text>
  <g>
    <rect x="180" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="209" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="238" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="267" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
  </g>
  <text x="302" y="631" font-size="16" fill="#94a3b8">…</text>
  <line x1="350" y1="605" x2="350" y2="645" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="631" font-size="14" font-weight="600" fill="#b45309">≤ S_d</text>

  <rect x="560" y="556" width="270" height="82" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="695" y="583" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Constraint: R_d ≥ S_d</text>
  <text x="695" y="607" font-size="12.5" fill="#92400e" text-anchor="middle">and R_w / R_d / S_d cannot all be zero</text>
  <text x="695" y="627" font-size="12" fill="#b45309" text-anchor="middle">(prevents unbounded token spend)</text>

  <line x1="48" y1="672" x2="1192" y2="672" stroke="#e5e7eb"/>
  <text x="48" y="702" font-size="13" fill="#6b7280">0 = no limit for that dimension. Once the silent allowance is used up, the remaining rounds in the window are forced visible; a new user message starts a new window.</text>
</svg>
