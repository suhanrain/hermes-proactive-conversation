<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4b6fff"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="48" y="56" font-size="28" font-weight="700" fill="#111827">proactive-conversation 两层计数模型</text>
  <text x="48" y="86" font-size="15" fill="#6b7280">窗口层：每次「用户发言」开一个新窗口（不是逐条滑动）　·　天层：当天所有窗口累计</text>

  <!-- 图例 -->
  <rect x="936" y="40" width="16" height="16" rx="7" fill="#2f9e6e"/>
  <text x="960" y="54" font-size="14" fill="#374151">可见</text>
  <rect x="1016" y="40" width="16" height="16" rx="7" fill="#dbe3ec"/>
  <text x="1040" y="54" font-size="14" fill="#374151">沉默</text>
  <rect x="1098" y="40" width="16" height="16" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="1122" y="54" font-size="14" fill="#374151">未用</text>

  <!-- ① 窗口层 -->
  <text x="48" y="140" font-size="19" font-weight="700" fill="#111827">① 窗口层</text>
  <text x="206" y="140" font-size="14" fill="#6b7280">每次用户发言重置一次；窗口内的尝试按顺序消耗</text>

  <!-- 窗口 1 用户发言标记 -->
  <text x="150" y="170" font-size="14" fill="#4b6fff" text-anchor="middle">用户发言</text>
  <line x1="150" y1="178" x2="150" y2="196" stroke="#4b6fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 窗口 1 格子：沉默 沉默 沉默 可见 可见 -->
  <g>
    <rect x="120" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="150" y="222" font-size="11" fill="#64748b" text-anchor="middle">①</text>
    <text x="150" y="243" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">沉默</text>

    <rect x="190" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="220" y="222" font-size="11" fill="#64748b" text-anchor="middle">②</text>
    <text x="220" y="243" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">沉默</text>

    <rect x="260" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="290" y="222" font-size="11" fill="#64748b" text-anchor="middle">③</text>
    <text x="290" y="243" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">沉默</text>

    <rect x="330" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="360" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">④</text>
    <text x="360" y="243" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">可见</text>

    <rect x="400" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="430" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">⑤</text>
    <text x="430" y="243" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">可见</text>
  </g>
  <!-- 窗口 1 大括号 -->
  <path d="M121 268 v10 q0 8 8 8 H452 q8 0 8 -8 v-10" fill="none" stroke="#4b6fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="290" y="308" font-size="14" font-weight="600" fill="#4b6fff" text-anchor="middle">窗口 1　R_w = 5</text>

  <text x="486" y="218" font-size="13" fill="#334155">至少 V_w = 2 条可见</text>
  <text x="486" y="244" font-size="13" fill="#334155">可沉默 = R_w − V_w = 3</text>
  <text x="486" y="270" font-size="12.5" fill="#b45309">额度用完 → 剩余轮次强制可见</text>
  <text x="486" y="296" font-size="12.5" fill="#6b7280">（系统自动推导，不单独配置）</text>

  <!-- 窗口 2 用户发言标记 -->
  <text x="766" y="170" font-size="14" fill="#4b6fff" text-anchor="middle">用户又发言 → 开新窗口</text>
  <line x1="766" y1="178" x2="766" y2="196" stroke="#4b6fff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 窗口 2 格子：可见 可见 沉默 未用 未用 -->
  <g>
    <rect x="730" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="760" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">①</text>
    <text x="760" y="243" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">可见</text>

    <rect x="800" y="198" width="60" height="60" rx="10" fill="#2f9e6e"/>
    <text x="830" y="222" font-size="11" fill="#d1fae5" text-anchor="middle">②</text>
    <text x="830" y="243" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">可见</text>

    <rect x="870" y="198" width="60" height="60" rx="10" fill="#dbe3ec" stroke="#c3ced9"/>
    <text x="900" y="222" font-size="11" fill="#64748b" text-anchor="middle">③</text>
    <text x="900" y="243" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">沉默</text>

    <rect x="940" y="198" width="60" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <text x="970" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">④</text>
    <text x="970" y="243" font-size="13" fill="#94a3b8" text-anchor="middle">未用</text>

    <rect x="1010" y="198" width="60" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <text x="1040" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">⑤</text>
    <text x="1040" y="243" font-size="13" fill="#94a3b8" text-anchor="middle">未用</text>
  </g>
  <path d="M731 268 v10 q0 8 8 8 H1062 q8 0 8 -8 v-10" fill="none" stroke="#4b6fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="900" y="308" font-size="14" font-weight="600" fill="#4b6fff" text-anchor="middle">窗口 2　R_w = 5（剩余 2 次）</text>

  <text x="128" y="344" font-size="13" fill="#6b7280">旧窗口在用户再次发言时结束；计数不会跨窗口延续。</text>

  <line x1="48" y1="366" x2="1192" y2="366" stroke="#e5e7eb"/>

  <!-- ② 天层 -->
  <text x="48" y="404" font-size="19" font-weight="700" fill="#111827">② 天层</text>
  <text x="206" y="404" font-size="14" fill="#6b7280">当天所有窗口里的尝试，向上汇总到日上限</text>

  <!-- 汇总：窗口行 -->
  <text x="60" y="455" font-size="13.5" fill="#374151">窗口 1</text>
  <g>
    <rect x="140" y="438" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="174" y="438" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="208" y="438" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="242" y="438" width="28" height="28" rx="6" fill="#2f9e6e"/>
    <rect x="276" y="438" width="28" height="28" rx="6" fill="#2f9e6e"/>
  </g>

  <text x="60" y="503" font-size="13.5" fill="#374151">窗口 2</text>
  <g>
    <rect x="140" y="486" width="28" height="28" rx="6" fill="#2f9e6e"/>
    <rect x="174" y="486" width="28" height="28" rx="6" fill="#2f9e6e"/>
    <rect x="208" y="486" width="28" height="28" rx="6" fill="#dbe3ec"/>
    <rect x="242" y="486" width="28" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <rect x="276" y="486" width="28" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3 3"/>
  </g>

  <line x1="222" y1="522" x2="222" y2="546" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- 当天尝试 -->
  <text x="60" y="584" font-size="13.5" fill="#374151">当天尝试</text>
  <g>
    <rect x="180" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="209" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="238" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="267" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
    <rect x="296" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
    <rect x="325" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
    <rect x="354" y="567" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="383" y="567" width="24" height="24" rx="5" fill="#2f9e6e"/>
  </g>
  <text x="418" y="585" font-size="16" fill="#94a3b8">…</text>
  <line x1="466" y1="559" x2="466" y2="599" stroke="#4b6fff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="476" y="585" font-size="14" font-weight="600" fill="#4b6fff">≤ R_d</text>

  <!-- 当天沉默 -->
  <text x="60" y="630" font-size="13.5" fill="#374151">当天沉默</text>
  <g>
    <rect x="180" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="209" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="238" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
    <rect x="267" y="613" width="24" height="24" rx="5" fill="#dbe3ec"/>
  </g>
  <text x="302" y="631" font-size="16" fill="#94a3b8">…</text>
  <line x1="350" y1="605" x2="350" y2="645" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="631" font-size="14" font-weight="600" fill="#b45309">≤ S_d</text>

  <!-- 约束徽章 -->
  <rect x="560" y="556" width="250" height="82" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="685" y="584" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">约束：R_d ≥ S_d</text>
  <text x="685" y="608" font-size="12.5" fill="#92400e" text-anchor="middle">且 R_w / R_d / S_d 不能同时为 0</text>
  <text x="685" y="628" font-size="12" fill="#b45309" text-anchor="middle">（防无上限烧 token）</text>

  <!-- 底部说明 -->
  <line x1="48" y1="672" x2="1192" y2="672" stroke="#e5e7eb"/>
  <text x="48" y="702" font-size="13" fill="#6b7280">0 = 该维度不设限。沉默额度用完后，窗口内剩余轮次强制可见；用户一发言，新的窗口重新开始。</text>
</svg>
